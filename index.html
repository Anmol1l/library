<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>Book Tracker</h1>
        <div>
            <button class="open-addBook" title="add">+ Add Book</button>
        </div>
    </header>


    <dialog class="dialog-addBook" closedby="any">

        <form action="#" class="bookForm">

            <div class="title">
                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="author">
                <label for="author">Author:</label>
                <input type="text" name="author" id="author" required>
            </div>

            <div class="pages">
                <label for="pages">Pages:</label>
                <input type="number" name="pages" id="pages" required>
            </div>

            <div class="status">
                <input type="checkbox" name="status" id="status">
                <label for="status">Read</label>
            </div>

            <div class="buttons">
                <button type="submit" class="add">Add</button>
                <button type="button" class="close">Cancel</button>
            </div>

        </form>

    </dialog>

    <main>

        <div class="book-card read">
            <h2>The Picture of Dorian Gray</h2>
            <hr>
            <div class="book-info">
                <p>Oscar Wilde</p>
                <p>200 Pages</p>
                <div class="status-delete">
                    <button class="status"><span style="vertical-align: middle;">&bull;</span></button>
                    <button class="delete"><img src="images-and-icons/icons/delete.svg" alt="delete"></button>
                </div>
            </div>
        </div>

        <div class="book-card unread">
            <h2>The Picture of Dorian Gray</h2>
            <hr>
            <div class="book-info">
                <p>Oscar Wilde</p>
                <p>200 Pages</p>
                <div class="status-delete">
                    <button class="status"><span style="vertical-align: middle;">&bull;</span></button>
                    <button class="delete"><img src="images-and-icons/icons/delete.svg" alt="delete"></button>
                </div>
            </div>
        </div>
        

    </main>



</body>

</html>
